<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Join · Groundline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='staff.css') }}">
</head>
<body class="join-page">
  <main class="join">
    <h1>Join the welfare check</h1>
    <form method="post" action="/join">
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" value="{{ name }}" maxlength="40" required autofocus
               autocomplete="off" autocapitalize="words" enterkeyhint="join">
      </div>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="btn" type="submit">Join</button>
    </form>
    <p class="fine">This phone stays {{ name or "the name you type" }}. Another person needs their own phone.</p>
  </main>
</body>
</html>
