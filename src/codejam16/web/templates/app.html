<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Welfare checks · Groundline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='staff.css') }}">
</head>
<body>
  <div class="app" id="app" data-initial-tab="{{ initial_tab }}">
    <header class="head">
      <b>{{ viewer.name }}</b>
      <span class="sync" id="sync" role="status"></span>
      <a href="/join">Change name</a>
    </header>
    <nav class="tabs" aria-label="Views">
      <button type="button" data-tab="checks" aria-pressed="true">Checks</button>
      <button type="button" data-tab="map" aria-pressed="false">Map</button>
    </nav>
    <div class="panes">
      <section class="pane on" id="checks-pane" aria-label="Checks">
        <div id="checks"></div>
        <div class="recent" id="recent"></div>
      </section>
      <section class="pane" id="map-pane" aria-label="Venue map">
        <svg id="map" viewBox="0 0 760 440" role="group" aria-label="Venue map">
          <rect x="3" y="3" width="754" height="434" rx="22" fill="none" stroke="var(--line)" stroke-width="3"/>
          <path d="M426 3v434M426 194h331" fill="none" stroke="var(--line)" stroke-width="3"/>
          <g id="pins"></g>
        </svg>
        <div id="zone-lines"></div>
        <p class="fine">Tap a pin to open the check.</p>
      </section>
    </div>
    <footer class="feed" id="feed">Connecting…</footer>
  </div>
  <script src="{{ url_for('static', filename='latency.js') }}"></script>
  <script src="{{ url_for('static', filename='staff.js') }}" defer></script>
</body>
</html>
